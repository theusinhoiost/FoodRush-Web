<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="foodrush-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="55%" stop-color="#F05225" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="flame-fill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#foodrush-grad)" />

  <!-- Subtle Inner Highlight Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="8" />

  <!-- Lucide Flame Icon (centered & scaled from 24x24) -->
  <g transform="translate(100, 96) scale(13)">
    <path
      d="M12 3 Q13 7 16 9.5 T19 15 A7 7 0 0 1 5 15 A5 5 0 0 1 6 12 A1 1 0 0 0 11 12 C11 10 9.5 9 9.5 7 Q9.5 5 12 3 Z"
      fill="url(#flame-fill)"
      stroke="#FFFFFF"
      stroke-width="2.15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
